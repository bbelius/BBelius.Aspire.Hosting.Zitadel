name: Release to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty to use csproj version)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Pack
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            dotnet pack --no-build --configuration Release --output ./artifacts /p:Version=${{ inputs.version }}
          else
            dotnet pack --no-build --configuration Release --output ./artifacts
          fi

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./artifacts/*.snupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
